schema_version: 1
tool_version: v1.3.0
tool_checksums_sha256: 72d38d7d0cab33bfeb9345df6b141eacf9841c5d6817f597ff25b957dc8dc48f
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
    - module: providers/confluent
      archive: .verification/mutation/bootstrap/providers-confluent.zip
      ledger: .verification/mutation/migration-ledger.json
    - module: providers/glue
      archive: .verification/mutation/bootstrap/providers-glue.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: go-doc
      path: api/baseline.txt
      packages:
        - .
        - ./formats/avro
        - ./formats/jsonschema
        - ./formats/protobuf
    - module: providers/confluent
      mode: go-doc
      path: providers/confluent/api/baseline.txt
      packages:
        - .
    - module: providers/glue
      mode: go-doc
      path: providers/glue/api/baseline.txt
      packages:
        - .
operations:
  - module: .
    gate: conformance
    steps:
      - type: go-test
        packages: [./...]
        run: '^(TestCanonicalFingerprintCorpus|TestCanonicalizerUsesAvroParsingCanonicalForm|TestCanonicalizerRejectsExcessiveNestingBeforeAvroParsing|TestCanonicalizerUsesOnlyExplicitLocalReferenceResourcesAndDialect|TestCodecValidatesEncodedAndDecodedPayloads|TestCanonicalizerUsesDeterministicLinkedDescriptors|TestCanonicalizerRejectsAggregateImportTextBeforeCompilation|TestCompileFingerprintIncludesPortableReferences|TestCodecIntegrationKeepsFramingResolutionAndBusinessCodecExplicit)$'
        timeout: 5m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzCompileDefinitions$'
        budget: 100x
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzReferenceGraphs$'
        budget: 100x
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzBundleLoading$'
        budget: 100x
        timeout: 2m
      - type: go-test
        packages: [./formats/avro]
        fuzz: '^FuzzAvroSchemas$'
        budget: 100x
        timeout: 2m
      - type: go-test
        packages: [./formats/jsonschema]
        fuzz: '^FuzzJSONSchemas$'
        budget: 100x
        timeout: 2m
      - type: go-test
        packages: [./formats/protobuf]
        fuzz: '^FuzzProtobufSchemas$'
        budget: 100x
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
  - module: providers/confluent
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: confluent-interoperability
        timeout: 20m
  - module: providers/confluent
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzWireFrames$'
        budget: 100x
        timeout: 2m
  - module: providers/confluent
    gate: benchmark
    steps:
      - type: go-test
        packages: [.]
        benchmark: .
        budget: 100ms
        timeout: 20m
  - module: providers/confluent
    gate: interoperability
    steps:
      - type: make
        makefile: verification/package.mk
        target: confluent-interoperability
        timeout: 20m
  - module: providers/glue
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: glue-conformance
        timeout: 10m
  - module: providers/glue
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzWireFrames$'
        budget: 100x
        timeout: 2m
  - module: providers/glue
    gate: benchmark
    steps:
      - type: go-test
        packages: [.]
        benchmark: .
        budget: 100ms
        timeout: 20m
  - module: providers/glue
    gate: interoperability
    steps:
      - type: make
        makefile: verification/package.mk
        target: glue-interoperability
        timeout: 20m
