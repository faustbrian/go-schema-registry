schema_version: 1
tool_version: v2.1.3
tool_checksums_sha256: 59e2a0882ddfc7a1b2acd64b1d1ed51d40e325f9a0e4cec11cac41a4ce92c888
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
    - module: providers/confluent
      archive: .verification/mutation/bootstrap/providers-confluent.zip
      ledger: .verification/mutation/migration-ledger.json
    - module: providers/glue
      archive: .verification/mutation/bootstrap/providers-glue.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: go-doc
      path: api/v3.txt
      packages:
        - .
        - ./formats/avro
        - ./formats/jsonschema
        - ./formats/protobuf
    - module: providers/confluent
      mode: go-doc
      path: providers/confluent/api/v3.txt
      packages:
        - .
    - module: providers/glue
      mode: go-doc
      path: providers/glue/api/v2.txt
      packages:
        - .
operations:
  - module: .
    gate: local-test
    steps:
      - type: go-test
        packages: [.]
        run: '^TestResolveCacheCoalescesLoadsAndCancelsWaiters$'
        count: 1
        race: true
        timeout: 2m
  - module: .
    gate: conformance
    steps:
      - type: go-test
        packages: [./...]
        run: '^(TestCanonicalFingerprintCorpus|TestCanonicalizerUsesAvroParsingCanonicalForm|TestCanonicalizerRejectsExcessiveNestingBeforeAvroParsing|TestCanonicalizerUsesOnlyExplicitLocalReferenceResourcesAndDialect|TestCodecValidatesEncodedAndDecodedPayloads|TestCanonicalizerUsesDeterministicLinkedDescriptors|TestCanonicalizerRejectsAggregateImportTextBeforeCompilation|TestCompileFingerprintIncludesPortableReferences|TestCodecIntegrationKeepsFramingResolutionAndBusinessCodecExplicit)$'
        timeout: 5m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzCompileDefinitions$'
        budget: 100x
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzReferenceGraphs$'
        budget: 100x
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzBundleLoading$'
        budget: 100x
        timeout: 2m
      - type: go-test
        packages: [./formats/avro]
        fuzz: '^FuzzAvroSchemas$'
        budget: 100x
        timeout: 2m
      - type: go-test
        packages: [./formats/jsonschema]
        fuzz: '^FuzzJSONSchemas$'
        budget: 100x
        timeout: 2m
      - type: go-test
        packages: [./formats/protobuf]
        fuzz: '^FuzzProtobufSchemas$'
        budget: 100x
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
  - module: providers/confluent
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: confluent-interoperability
        timeout: 20m
  - module: providers/confluent
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzWireFrames$'
        budget: 100x
        timeout: 2m
  - module: providers/confluent
    gate: benchmark
    steps:
      - type: go-test
        packages: [.]
        benchmark: .
        budget: 100ms
        timeout: 20m
  - module: providers/confluent
    gate: interoperability
    steps:
      - type: make
        makefile: verification/package.mk
        target: confluent-interoperability
        timeout: 20m
  - module: providers/glue
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: glue-conformance
        timeout: 10m
  - module: providers/glue
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzWireFrames$'
        budget: 100x
        timeout: 2m
  - module: providers/glue
    gate: benchmark
    steps:
      - type: go-test
        packages: [.]
        benchmark: .
        budget: 100ms
        timeout: 20m
  - module: providers/glue
    gate: interoperability
    steps:
      - type: make
        makefile: verification/package.mk
        target: glue-interoperability
        timeout: 20m
